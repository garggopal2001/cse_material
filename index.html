<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GG Gallery - Professional Photo & Video Archive">
    <title>GG Gallery</title>

    <!-- Favicon -->
    <link rel="icon"
        href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%234f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16 3.95 6.06M14.31 16H2.83m13.79-4-5.74 9.94"/></svg>'
        type="image/svg+xml">

    <!-- External Dependencies: Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- Data Source -->
    <script src="gallery_data.js?v=2" defer></script>

    <!-- Application Styles -->
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <!-- 1. NAVIGATION BAR -->
    <header class="navbar" role="banner">
        <div class="nav-left">
            <button class="icon-btn sidebar-toggle" id="btnToggleSidebar" aria-label="Toggle Sidebar">
                <i data-lucide="menu"></i>
            </button>
            <a href="#" class="brand" id="btnHome" aria-label="Go to Home">
                <i data-lucide="aperture"></i>
                <span>GG Gallery</span>
            </a>
        </div>

        <div class="nav-right">
            <div class="search-bar" role="search">
                <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
                <input type="search" class="search-input" placeholder="Search files..." id="searchInput"
                    aria-label="Search">
            </div>

            <nav class="nav-controls" aria-label="User Controls">
                <a href="#" class="icon-btn ext-link" aria-label="Instagram">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                        <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
                    </svg>
                </a>
                <a href="#" class="icon-btn ext-link" aria-label="Facebook">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
                    </svg>
                </a>
                <a href="#" class="icon-btn ext-link" aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
                        <path d="M9 18c-4.51 2-5-2-7-2" />
                    </svg>
                </a>
                <a href="#" class="icon-btn ext-link" aria-label="LinkedIn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
                        <rect width="4" height="12" x="2" y="9" />
                        <circle cx="4" cy="4" r="2" />
                    </svg>
                </a>

                <div class="nav-divider" aria-hidden="true"></div>

                <button class="icon-btn" id="btnFullscreenApp" aria-label="Toggle Fullscreen">
                    <i data-lucide="maximize"></i>
                </button>
                <button class="icon-btn" id="btnThemeToggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" id="themeIcon"></i>
                </button>
                <button class="icon-btn" id="btnSettings" aria-label="Settings">
                    <i data-lucide="settings"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- 2. MAIN APPLICATION LAYOUT -->
    <div class="app-layout">

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar" aria-label="Folder Navigation">
            <nav class="sidebar-content" id="navTree" role="tree">
                <!-- Dynamic Tree Content injected here -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" role="main">
            <div class="content-wrapper">
                <nav class="breadcrumb-container" id="breadcrumbs" aria-label="Breadcrumb">
                    <!-- Dynamic Breadcrumbs injected here -->
                </nav>

                <header class="gallery-header">
                    <div>
                        <h1 class="gallery-title" id="pageTitle">Home</h1>
                        <p class="gallery-meta" id="pageMeta">Loading...</p>
                    </div>
                </header>

                <section class="gallery-grid" id="galleryGrid" aria-live="polite">
                    <!-- Dynamic Grid Cards injected here -->
                </section>
            </div>

            <footer class="footer" role="contentinfo">
                <p>Built with ❤️ by Gopal and AntiGravity.</p>
            </footer>
        </main>
    </div>

    <!-- 3. MEDIA VIEWER OVERLAY (MODAL) -->
    <div class="media-viewer" id="mediaViewer" role="dialog" aria-modal="true" aria-label="Media Viewer">
        <header class="viewer-toolbar">
            <div class="viewer-info">
                <h2 class="viewer-filename" id="viewerTitle">Filename</h2>
                <span class="viewer-counter" id="viewerCounter">1 / 1</span>
            </div>
            <nav class="viewer-controls" aria-label="Media Controls">
                <button class="icon-btn btn-favorite" id="btnFavorite" aria-label="Toggle Favorite"><i
                        data-lucide="heart"></i></button>
                <button class="icon-btn" id="btnShare" aria-label="Share Media"><i data-lucide="share-2"></i></button>
                <button class="icon-btn" id="btnDownload" aria-label="Download Media"><i
                        data-lucide="download"></i></button>
                <button class="icon-btn" id="btnZoomOut" aria-label="Zoom Out"><i data-lucide="minus"></i></button>
                <button class="icon-btn" id="btnZoomIn" aria-label="Zoom In"><i data-lucide="plus"></i></button>
                <div class="nav-divider"></div>
                <button class="icon-btn play-btn" id="btnSlideshow" aria-label="Toggle Slideshow"><i
                        data-lucide="play"></i></button>
                <div class="speed-control-wrapper">
                    <i data-lucide="timer"></i>
                    <select id="viewerSpeedSelect" class="minimal-select" aria-label="Slideshow Speed">
                        <option value="2000">2s</option>
                        <option value="3000" selected>3s</option>
                        <option value="5000">5s</option>
                        <option value="10000">10s</option>
                    </select>
                </div>
                <button class="icon-btn" id="btnFullscreenMedia" aria-label="Toggle Fullscreen"><i
                        data-lucide="expand"></i></button>
                <button class="icon-btn" id="btnCloseViewer" aria-label="Close Viewer"><i data-lucide="x"></i></button>
            </nav>
        </header>

        <button class="nav-arrow nav-prev" id="btnPrevMedia" aria-label="Previous Media"><i
                data-lucide="chevron-left"></i></button>
        <button class="nav-arrow nav-next" id="btnNextMedia" aria-label="Next Media"><i
                data-lucide="chevron-right"></i></button>

        <div class="viewer-content" id="viewerContent">
            <div class="loader" id="viewerLoader" aria-label="Loading media..."></div>
        </div>
    </div>

    <!-- 4. SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="settingsTitle">Preferences</h2>
                <button class="icon-btn" id="btnCloseSettings" aria-label="Close Settings"><i
                        data-lucide="x"></i></button>
            </header>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="prefSlideshowSpeed">Slideshow Speed</label>
                    <select id="prefSlideshowSpeed" class="custom-select">
                        <option value="2000">Fast (2s)</option>
                        <option value="3000">Normal (3s)</option>
                        <option value="5000">Slow (5s)</option>
                        <option value="10000">Very Slow (10s)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button id="btnBackToTop" class="back-to-top" aria-label="Back to Top">
        <i data-lucide="arrow-up"></i>
    </button>

    <!-- Application Script -->
    <script src="script.js?v=2"></script>
</body>

</html>
